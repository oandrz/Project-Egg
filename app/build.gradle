repositories {
    mavenCentral()
}

configurations.all {
    resolutionStrategy.force "junit:junit:4.13"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    //Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    //android support & recyclerview
    implementation "androidx.appcompat:appcompat:$rootProject.ext.legacySupportVersion"
    implementation "com.google.android.material:material:$rootProject.ext.materialDesignVersion"

    //dagger
    implementation "com.google.dagger:dagger:$rootProject.ext.daggerVersion"
    implementation "com.google.dagger:dagger-android-support:$rootProject.ext.daggerVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    kapt "com.google.dagger:dagger-compiler:$rootProject.ext.daggerVersion"
    kapt "com.google.dagger:dagger-android-processor:$rootProject.ext.daggerVersion"

    //Retrofit
    implementation "com.squareup.retrofit2:retrofit:$rootProject.ext.retrofitVersion"
    implementation "com.squareup.retrofit2:converter-gson:$rootProject.ext.retrofitVersion"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$rootProject.ext.retrofitVersion"

    //Android RX
    implementation "io.reactivex.rxjava2:rxjava:$rootProject.ext.rxjavaVersion"
    implementation "io.reactivex.rxjava2:rxandroid:$rootProject.ext.rxAndroidVersion"

    //OkHttp
    implementation "com.squareup.okhttp3:okhttp:$rootProject.ext.okhttpVersion"
    implementation "com.squareup.okhttp3:logging-interceptor:$rootProject.ext.okhttpVersion"

    //Clarifai
    implementation "com.clarifai.clarifai-api2:core:$rootProject.ext.clarifaiVersion"

    //PermissionsDispatcher
    implementation "com.github.permissions-dispatcher:permissionsdispatcher:$rootProject.ext.permissionsDispatcherVersion"
    kapt "com.github.permissions-dispatcher:permissionsdispatcher-processor:$rootProject.ext.permissionsDispatcherVersion"

    //Glide
    implementation "com.github.bumptech.glide:glide:$rootProject.ext.glideVersion"
    kapt "com.github.bumptech.glide:compiler:$rootProject.ext.glideVersion"

    //Firebase
    implementation "com.google.firebase:firebase-core:$rootProject.ext.firebaseCoreVersion"
    implementation "com.google.firebase:firebase-auth:$rootProject.ext.firebaseAuthVersion"
    implementation "com.google.firebase:firebase-analytics:$rootProject.ext.firebaseAnalytic"
    implementation "com.google.firebase:firebase-firestore-ktx:$rootProject.ext.firebaseCloudStoreVersion"

    //endless Recycler View
    implementation "com.mikepenz:fastadapter:$rootProject.ext.fastAdapterVersion"
    implementation "com.mikepenz:fastadapter-extensions-scroll:$rootProject.ext.fastAdapterVersion" // scroll helpers
    implementation "com.mikepenz:fastadapter-extensions-ui:$rootProject.ext.fastAdapterVersion"

    //Material Dialog
    implementation "com.afollestad.material-dialogs:core:$rootProject.ext.materialDialogVersion"

    //Circle Image View
    implementation "de.hdodenhof:circleimageview:$rootProject.ext.circleIVVersion"

    //Zeibatsu Compressor
    implementation "id.zelory:compressor:$rootProject.ext.zeibatsuVersion"

    //Admobs
    implementation "com.google.android.gms:play-services-ads:$rootProject.ext.adMobVersion"

    //Preference
    implementation "androidx.preference:preference:$rootProject.ext.preferenceVersion"

    //Room
    implementation "androidx.room:room-runtime:$rootProject.ext.roomVersion"
    implementation "androidx.room:room-rxjava2:$rootProject.ext.roomVersion"
    kapt "androidx.room:room-compiler:$rootProject.ext.roomVersion"
    testImplementation "androidx.room:room-testing:$rootProject.ext.roomVersion"

    //Status Bar - Removed, using native Android APIs instead

    // Unit Test
    testImplementation "org.robolectric:robolectric:4.4"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    kaptTest "com.google.dagger:dagger-compiler:$daggerVersion"
    testImplementation 'androidx.arch.core:core-testing:2.1.0'
    testImplementation "org.hamcrest:hamcrest-library:$hamcrestVersion"

    // Required -- JUnit 4 framework
    testImplementation 'junit:junit:4.13'
    // Optional -- Robolectric environment
    testImplementation 'androidx.test:core:1.3.0'

    // Core library
    androidTestImplementation 'androidx.test:core:1.3.0'

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.3.0'

    // Assertions
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.ext:truth:1.3.0'
    androidTestImplementation 'com.google.truth:truth:1.0'

    // Espresso dependencies
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.3.0'
    androidTestImplementation 'androidx.test.espresso.idling:idling-concurrent:3.3.0'

    // The following Espresso dependency can be either "implementation"
    // or "androidTestImplementation", depending on whether you want the
    // dependency to appear on your APK's compile classpath or the test APK
    // classpath.
    androidTestImplementation 'androidx.test.espresso:espresso-idling-resource:3.3.0'

    //Material Design
    implementation "com.google.android.material:material:$rootProject.ext.materialDesignVersion"
    
    //SwipeRefreshLayout
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
