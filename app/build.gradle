android {
    namespace 'starbright.com.projectegg'
    
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        debug.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    signingConfigs {
        config {
            keyAlias 'key0'
            keyPassword 'Per5eu$7'
            storeFile file('/Users/ovo/StudioProjects/RecipeScopeKey')
            storePassword 'Per5eu$7'
        }
    }
    compileSdkVersion 34

    defaultConfig {
        applicationId "starbright.com.projectegg"
        minSdkVersion 24
        targetSdkVersion 34
        buildToolsVersion '34.0.0'
        versionCode 8
        versionName "0.1.2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField "String", "CLARIFAI_KEY", "\"d724362606ac43c39a3a3cee03b85657\""
        buildConfigField "String", "BASE_URL", "\"https://api.spoonacular.com\""
        signingConfig signingConfigs.config
        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas".toString())
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            debuggable false
            minifyEnabled true
            applicationIdSuffix ".release"
            versionNameSuffix "-release"
            signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    kotlinOptions {
        jvmTarget = '11'
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    flavorDimensions "version"
    productFlavors {
        develop {
            dimension "version"
            versionNameSuffix "-develop"
            resValue 'string', 'app_name', '\"Chefnut-Dev\"'
            buildConfigField 'String', 'SPOON_KEY', '\"c14f35c6748443ef89c645e7a09404c7\"'
            buildConfigField 'String', 'REWARD_ADS_ID', '\"ca-app-pub-3940256099942544/5224354917\"'
            buildConfigField 'String', 'INTERSTITIAL_ADS_ID', '\"ca-app-pub-3940256099942544/1033173712\"'
            resValue 'string', 'APP_ADS_UNIT_ID', '\"ca-app-pub-3940256099942544/6300978111\"'
        }

        production {
            dimension "version"
            versionNameSuffix "-full"
            resValue 'string', 'app_name', '\"Chefnut\"'
            buildConfigField 'String', 'SPOON_KEY', '\"c14f35c6748443ef89c645e7a09404c7\"'
            buildConfigField 'String', 'REWARD_ADS_ID', '\"ca-app-pub-9465452265341097/7691435683\"'
            buildConfigField 'String', 'INTERSTITIAL_ADS_ID', '\"ca-app-pub-9465452265341097/9375858926\"'
            resValue 'string', 'APP_ADS_UNIT_ID', '\"ca-app-pub-9465452265341097/6594268019\"'
        }
